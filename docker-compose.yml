services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anoda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-anoda_facematch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-anoda} -d ${POSTGRES_DB:-anoda_facematch}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai_service:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    volumes:
      - uploads:/app/apps/api/src/uploads
    deploy:
      resources:
        limits:
          memory: 3.5G
        reservations:
          memory: 1.5G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      target: api
    command: sh -c "cd apps/api && bun run migrate && bunx prisma db seed && cd /app && bun run start:api"
    ports:
      - "3005:3005"
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://anoda:password@db:5432/anoda_facematch?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai_service:8000}
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_REGION=${R2_REGION:-auto}
      - SENTRY_DSN=${SENTRY_DSN}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://lumina.otagera.xyz,https://lumina-events.otagera.xyz}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - uploads:/app/apps/api/src/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://anoda:password@db:5432/anoda_facematch?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai_service:8000}
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_REGION=${R2_REGION:-auto}
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
    volumes:
      - uploads:/app/apps/api/src/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: .
      target: client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3005}
      - VITE_GUEST_APP_URL=${VITE_GUEST_APP_URL:-http://localhost:5174}
    depends_on:
      api:
        condition: service_started

  guest_app:
    build:
      context: .
      target: app
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3005}
      - VITE_CLIENT_APP_URL=${VITE_CLIENT_APP_URL:-http://localhost:5173}
    depends_on:
      api:
        condition: service_started

  logtail:
    image: timberio/vector:latest-debian
    container_name: vector
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      - BETTER_STACK_SOURCE_TOKEN=${BETTER_STACK_SOURCE_TOKEN}
      - VECTOR_LOG=debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/vector.yaml:/etc/vector/vector.yaml:ro
    restart: always

volumes:
  postgres_data:
  uploads:
