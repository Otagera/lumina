[install]
# 3-day minimum release age (in seconds) to mitigate supply chain attacks
minimumReleaseAge = 259200

# Exempt all workspace packages from the age gate (they are internal/ vetted)
minimumReleaseAgeExcludes = [
  "@lumina/app",
  "@lumina/api",
  "@lumina/worker",
  "@lumina/client",
  "@lumina/ui",
  "@lumina/config",
  "@lumina/auth",
  "@lumina/utils",
  "@lumina/models",
  "@lumina/email",
]