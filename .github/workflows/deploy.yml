name: Build & Deploy

# Triggered on every push to main, or manually from the Actions tab.
# Only services whose source files changed get rebuilt.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force rebuild all services (ignores path filters)"
        type: boolean
        default: false

# All build jobs share these — lets them push to GHCR using the
# automatic GITHUB_TOKEN without any extra secrets.
permissions:
  contents: read
  packages: write

jobs:
  # ── 1. Detect which services changed ─────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api:       ${{ steps.filter.outputs.api }}
      worker:    ${{ steps.filter.outputs.worker }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      ai:        ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so paths-filter can diff correctly

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'Dockerfile'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'Dockerfile'
            dashboard:
              - 'apps/client/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'Dockerfile'
            ai:
              - 'apps/ai/**'
              - 'requirements.txt'

  # ── 2. Build jobs (run in parallel when triggered) ────────────────────

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event.inputs.force_all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lumina-api:latest
          # GHA cache: unchanged layers (bun install, etc.) are reused
          # across runs even when only one file changed.
          cache-from: type=gha,scope=api
          cache-to:   type=gha,scope=api,mode=max

  build-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true' || github.event.inputs.force_all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lumina-worker:latest
          cache-from: type=gha,scope=worker
          cache-to:   type=gha,scope=worker,mode=max

  build-dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || github.event.inputs.force_all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: client
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lumina-dashboard:latest
          cache-from: type=gha,scope=dashboard
          cache-to:   type=gha,scope=dashboard,mode=max

  build-ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true' || github.event.inputs.force_all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ai/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lumina-ai:latest
          cache-from: type=gha,scope=ai
          cache-to:   type=gha,scope=ai,mode=max

  # ── 3. Tell Coolify to pull the new images ────────────────────────────
  #
  # Only runs if at least one build job succeeded.
  # Skipped build jobs (no changes) don't block this from running.
  #
  # Secrets to add in GitHub → Settings → Secrets and variables → Actions:
  #   COOLIFY_URL        — base URL of your Coolify instance, e.g. https://coolify.example.com
  #   COOLIFY_APP_UUID   — the UUID of your application in Coolify
  #                        (visible in the URL when you open your app: /applications/<uuid>)
  #   COOLIFY_TOKEN      — Coolify profile → API Tokens → create one, paste here
  deploy:
    needs: [build-api, build-worker, build-dashboard, build-ai]
    if: |
      always() && !failure() && !cancelled() &&
      (needs.build-api.result       == 'success' ||
       needs.build-worker.result    == 'success' ||
       needs.build-dashboard.result == 'success' ||
       needs.build-ai.result        == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify redeploy
        run: |
          curl -fsSL -X POST \
            "${{ secrets.COOLIFY_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/restart" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json"
